<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EmulatorJS</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="ejs-zone"></div>

  <script>
    // ---------- URL 参数 ----------
    const params = new URLSearchParams(window.location.search);
    const core = params.get('core') || 'nes';
    const gameUrl = params.get('gameUrl');
    const biosUrl = params.get('biosUrl') || '';
    const gameName = params.get('gameName') || 'Game';
    const gameSlug = params.get('gameId') || 'unknown';
    const pathtodata = params.get('pathtodata') || 'https://cdn.emulatorjs.org/stable/data/';

    // slug → numeric hash (EJS_gameID 需要数字以隔离存档)
    function hashSlug(slug) {
      let hash = 0;
      for (let i = 0; i < slug.length; i++) {
        hash = ((hash << 5) - hash) + slug.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash) || 1;
    }

    // ---------- EmulatorJS 配置 ----------
    window.EJS_player = '#ejs-zone';
    window.EJS_core = core;
    window.EJS_gameUrl = gameUrl;
    window.EJS_biosUrl = biosUrl;
    window.EJS_pathtodata = pathtodata;
    window.EJS_gameName = gameName;
    window.EJS_gameID = hashSlug(gameSlug);
    window.EJS_startOnLoaded = true;
    window.EJS_fixedSaveInterval = 30000;
    window.EJS_color = '#e02d7a';
    window.EJS_volume = 0.5;

    // 按钮显隐
    window.EJS_Buttons = {
      screenRecord: false,
      cheat: false,
      screenshot: false,
      cacheManager: false,
    };

    // ---------- 就绪通知 ----------
    window.EJS_ready = () => {
      window.parent.postMessage({ type: 'ready' }, '*');
    };

    // ---------- 退出通知 ----------
    window.EJS_onExit = () => {
      window.parent.postMessage({ type: 'exit' }, '*');
    };

    // ---------- 注入 loader.js ----------
    const script = document.createElement('script');
    script.src = pathtodata + 'loader.js';
    document.head.appendChild(script);
  </script>
</body>
</html>
