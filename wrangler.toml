name = "retrovault"
main = ".output/server/index.mjs"
compatibility_date = "2026-05-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

assets = { directory = ".output/public" }

[vars]
SITE_URL = "https://retrovault.cc"
# JWT_SECRET and RESEND_API_KEY should be set via `wrangler secret put`:
#   wrangler secret put JWT_SECRET
#   wrangler secret put RESEND_API_KEY

[[kv_namespaces]]
binding = "RETROVAULT_KV"
# Set the ID after creating the namespace:
#   wrangler kv namespace create RETROVAULT_KV
# Then paste the returned id below.
id = ""
