name = "retrovault"
keep_vars = true
main = ".output/server/index.mjs"
compatibility_date = "2026-05-07"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

assets = { directory = ".output/public" }

routes = [
  { pattern = "retrovault.online", zone_name = "retrovault.online", custom_domain = true },
  { pattern = "www.retrovault.online", zone_name = "retrovault.online", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "retrovault"
database_id = "ab882efe-a603-47c1-87fa-7f80b960756b"

[[kv_namespaces]]
binding = "RETROVAULT"
id = "1ed00bf28c264f9dae2a7bf858a48af5"

# [[r2_buckets]]
#binding = "CDN"
#bucket_name = "retrovault"

[vars]
API_BASE = "https://retrovault.solomaker282.workers.dev"
